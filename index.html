<style>
:root{
  --bg:#E4E7EB; --panel:#FFFFFF; --panel-2:#F2F4F6; --ink:#1C2530; --ink-2:#56616D; --line:#CDD3DA;

  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);

}
@media (prefers-color-scheme: dark){

    --bg:#12171D; --panel:#1C232B; --panel-2:#232C35; --ink:#E6EBF0; --ink-2:#98A3AF; --line:#313B46;
    --signal:#4A8BE0; --signal-ink:#0C1520; --ok:#34C06A; --warn:#E6A92A; --bad:#EF5B4E; --led-off:#2E3843;
    --ok-bg:#15301F; --warn-bg:#352A12; --bad-bg:#3A1A17; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171D; --panel:#1C232B; --panel-2:#232C35; --ink:#E6EBF0; --ink-2:#98A3AF; --line:#313B46;
  --signal:#4A8BE0; --signal-ink:#0C1520; --ok:#34C06A; --warn:#E6A92A; --bad:#EF5B4E; --led-off:#2E3843;
  --ok-bg:#15301F; --warn-bg:#352A12; --bad-bg:#3A1A17; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}

.login{max-width:420px;margin:30px auto}
.fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin-top:8px}

.lbl-list li{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.lbl-list{list-style:none;padding:0;margin:10px 0}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}

</style>

<script>
(function(){
"use strict";

/* ================= conexión ================= */
const SUPA_URL = "https://hjcvfxfidjlxxpqvihqm.supabase.co";
const SUPA_KEY = "sb_publishable_hdFG-qfnXHtUGGz1BwZshw_N5CobWsG";

/* ================= utilidades ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").trim().toUpperCase().replace(/\s+/g, " ");
const canon = s => norm(s).replace(/\s/g, "").replace(/[OQ]/g, "0").replace(/[I|]/g, "1");
const clone = o => JSON.parse(JSON.stringify(o));
const now = () => new Date().toISOString();
const fmt = iso => { if (!iso) return ""; try { return new Date(iso).toLocaleString("es-VE", {day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); } catch(e){ return iso; } };
const num = s => parseFloat(String(s).replace(/\./g, "").replace(",", "."));
const n2 = x => Math.round((Number(x) || 0) * 100) / 100;
const fnum = x => n2(x).toLocaleString("es-VE", {maximumFractionDigits: 2});
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const MOTIVOS = ["Garantía o falla", "Cambio por otro producto", "Error de despacho", "El cliente desistió", "Otro"];
const TIPOS = {serial: "Unidad con serial", sinserial: "Unidad sin serial", metro: "Por metro (rollo)"};
function lev(a, b){
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({length: b.length + 1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++){
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function loadScript(src){
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = () => rej(new Error("No se pudo descargar un componente. Revisa la conexión a internet."));
    document.head.appendChild(el);
  });
}
const errMsg = e => {
  const m = (e && (e.message || e.error_description)) || String(e || "Error");
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Sin conexión a internet. Revisa la señal e intenta de nuevo.";
  if (/Invalid login credentials/i.test(m)) return "Correo o contraseña incorrectos.";
  const x = m.match(/^[A-Z_]+: (.*)$/s);
  return x ? x[1] : m;
};

/* ================= estado ================= */
const S = {
  view: "login", mode: null, user: null, perfil: null, busy: false,

};

const nombreUsuario = () => (S.perfil && (S.perfil.nombre || S.perfil.email)) || "";

/* ================= base de datos ================= */
let sb = null;
const DB = {
  async q(p){ const r = await p; if (r.error) throw r.error; return r.data; },
  async all(table, build){
    let out = [], from = 0;
    for (;;){
      let q = sb.from(table).select("*");
      if (build) q = build(q);
      const data = await this.q(q.range(from, from + 999));
      out = out.concat(data || []);
      if (!data || data.length < 1000) break;
      from += 1000;
    }
    return out;
  },
  one(table, col, val){ return this.q(sb.from(table).select("*").eq(col, val).maybeSingle()); },
  insert(table, rows){ return this.q(sb.from(table).insert(rows)); },
  upsert(table, rows, opts){ return this.q(sb.from(table).upsert(rows, opts)); },
  update(table, col, val, patch){ return this.q(sb.from(table).update(patch).eq(col, val)); },
  del(table, col, val){ return this.q(sb.from(table).delete().eq(col, val)); },
  rpc(fn, args){ return this.q(sb.rpc(fn, args)); }
};
let cola = Promise.resolve();
function enqueue(fn){
  cola = cola.then(fn).catch(e => { console.error(e); toast("No se pudo guardar: " + errMsg(e)); });
  return cola;
}
function toast(t){ S.msg = {kind: "bad", text: t}; if (!["despacho","ingresoRecibir","devolucion"].includes(S.view)) render(); else setStatus("bad", t); }

/* ---- catálogo en memoria ---- */
async function cargarCatalogo(){
  const [p, c] = await Promise.all([DB.all("productos"), DB.all("codigos_barra")]);
  S.prod = {}; S.canonIdx = {}; S.codes = {};
  p.forEach(x => { S.prod[x.codigo] = x; S.canonIdx[canon(x.codigo)] = x.codigo; });
  c.forEach(x => { S.codes[canon(x.codigo)] = x.producto; });
}
const productoDe = code => { const c = canon(code); return S.canonIdx[c] || S.codes[c] || null; };

let actx = null;
function beep(kind){
  if (navigator.vibrate) navigator.vibrate(kind === "ok" ? 60 : kind === "warn" ? 40 : [120, 60, 120]);
  if (!S.prefs.sonido) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const tones = kind === "ok" ? [[1046, 0, .09]] : kind === "warn" ? [[660, 0, .12]] : [[220, 0, .16], [200, .2, .2]];
    tones.forEach(([f, t, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = kind === "bad" ? "square" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(.18, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + t + d);
      o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + d + .02);
    });
  } catch(e){}
}

/* ================= lectura de facturas (PDF y foto) ================= */
async function pdfLineas(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++){
    const tc = await (await pdf.getPage(p)).getTextContent();
    const rows = [];
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const y = it.transform[5], x = it.transform[4];
      let r = rows.find(r => Math.abs(r.y - y) < 2.5);
      if (!r){ r = {y, parts: []}; rows.push(r); }
      r.parts.push({x, s: it.str});
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => out.push(r.parts.sort((a, b) => a.x - b.x).map(p => p.s).join(" ").replace(/\s+/g, " ").trim()));
  }
  return out;
}
function parseFactura(lines, ocr){
  const text = lines.join("\n");
  const pick = re => { const m = text.match(re); return m ? m[1].trim() : ""; };
  const f = {
    numero: pick(/Factura\s*N\S*\s*([A-Z0-9\-]+)/i),
    cliente: pick(/Cliente\s+([^\n]+)/i),
    rif: pick(/R\.?\s*I\.?\s*F\.?\s*:?\s*([A-Z0-9\-]+)/i),
    vendedor: pick(/Vendedor\s*([^\n]+)/i),
    fecha: pick(/Emisi[oó]n\s+([^\n]+)/i),
    items: []
  };
  const re = /^([A-Z0-9][A-Z0-9.\-\/]{1,})\s+(.+?)\s+(\d+(?:,\d+)?)\s+(\d{1,3}(?:\.\d{3})*,\d{2})\s+(\d{1,3}(?:\.\d{3})*,\d{2})$/i;
  const cuadra = (q, pr, tot) => Math.abs(q * pr - tot) <= Math.max(0.05, tot * 0.01);
  lines.forEach(raw => {
    const l = raw.replace(/^[^A-Za-z0-9]+/, "").replace(/(\d)\s*,\s*(\d{2})\b/g, "$1,$2").replace(/(\d)\s*\.\s*(\d{3})\b/g, "$1.$2").replace(/\s+/g, " ").trim();
    const m = l.match(re); if (!m) return;
    let q = num(m[3]); const pr = num(m[4]), tot = num(m[5]);
    let nota = "";
    if (!cuadra(q, pr, tot)){
      if (!ocr) return;
      const deduc = pr > 0 ? tot / pr : 0;
      if (deduc > 0 && Math.abs(deduc * 100 - Math.round(deduc * 100)) < 1){ nota = `Cantidad corregida con el total: se leyó ${m[3]}.`; q = n2(deduc); }
      else nota = "Los números de este renglón no cuadran: verifica la cantidad.";
    }
    if (!(q > 0)) return;
    f.items.push({codigo: norm(m[1]), descripcion: m[2].trim(), cantidad: n2(q), nota});
  });
  return f;
}
function ajustarConCatalogo(items){
  const codes = Object.keys(S.prod);
  if (!codes.length) return items;
  const tokens = t => new Set(norm(t).split(/[^A-Z0-9]+/).filter(x => x.length > 1));
  const simDesc = (a, b) => { const A = tokens(a), B = tokens(b); if (!A.size || !B.size) return 0; let n = 0; A.forEach(x => { if (B.has(x)) n++; }); return n / Math.max(A.size, B.size); };
  const exactos = new Set(items.map(it => productoDe(it.codigo)).filter(Boolean));
  return items.map(it => {
    const exacto = productoDe(it.codigo);
    if (exacto) return Object.assign({}, it, {codigo: exacto, descripcion: S.prod[exacto] ? S.prod[exacto].descripcion || it.descripcion : it.descripcion});
    const c = canon(it.codigo), tope = Math.max(1, Math.floor(c.length * 0.2));
    const cands = codes.map(k => ({k, d: lev(c, canon(k))})).filter(x => x.d <= tope && !exactos.has(x.k))
      .map(x => Object.assign(x, {score: x.d - simDesc(it.descripcion, S.prod[x.k].descripcion) * 0.9})).sort((a, b) => a.score - b.score);
    if (!cands.length) return Object.assign({}, it, {nota: `Producto nuevo: no está en el catálogo. ${it.nota || ""}`.trim()});
    if (cands.length > 1 && cands[1].score - cands[0].score < 0.15)
      return Object.assign({}, it, {nota: `Código dudoso (se leyó ${it.codigo}): puede ser ${cands.slice(0, 3).map(x => x.k).join(" o ")}. ${it.nota || ""}`.trim()});
    const best = cands[0].k;
    return Object.assign({}, it, {codigo: best, descripcion: S.prod[best].descripcion || it.descripcion, nota: `Código corregido con el catálogo: se leyó ${it.codigo}. ${it.nota || ""}`.trim()});
  });
}
let ocrWorker = null, ocrProgreso = null;
async function prepararImagen(file, maxLado, gris){
  let img;
  try { img = await createImageBitmap(file, {imageOrientation: "from-image"}); }
  catch(e){ img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("No se pudo abrir la foto.")); im.src = URL.createObjectURL(file); }); }
  const scale = Math.min(gris ? 2.5 : 1, maxLado / Math.max(img.width, img.height));
  const cv = document.createElement("canvas");
  cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
  const cx = cv.getContext("2d", {willReadFrequently: true});
  cx.drawImage(img, 0, 0, cv.width, cv.height);
  if (!gris) return cv;
  const id = cx.getImageData(0, 0, cv.width, cv.height), px = id.data, hist = new Uint32Array(256);
  for (let i = 0; i < px.length; i += 4){ const g = (px[i] * 299 + px[i + 1] * 587 + px[i + 2] * 114) / 1000 | 0; px[i] = g; hist[g]++; }
  const total = px.length / 4; let acc = 0, lo = 0, hi = 255;
  for (let v = 0; v < 256; v++){ acc += hist[v]; if (acc > total * 0.01){ lo = v; break; } }
  acc = 0; for (let v = 255; v >= 0; v--){ acc += hist[v]; if (acc > total * 0.01){ hi = v; break; } }
  const rango = Math.max(1, hi - lo);
  for (let i = 0; i < px.length; i += 4){ const g = Math.max(0, Math.min(255, (px[i] - lo) * 255 / rango)); px[i] = px[i + 1] = px[i + 2] = g; }
  cx.putImageData(id, 0, 0);
  return cv;
}
async function leerFoto(file, onPaso){
  const cv = await prepararImagen(file, 3000, true);
  if (!ocrWorker){
    onPaso("Descargando el lector de texto (solo la primera vez, puede tardar un minuto)…");
    await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js");
    ocrWorker = await Tesseract.createWorker("spa", 1, {logger: m => { if (ocrProgreso) ocrProgreso(m); }});
    await ocrWorker.setParameters({tessedit_pageseg_mode: "6", preserve_interword_spaces: "1"});
  }
  onPaso("Leyendo la factura… 0%");
  ocrProgreso = m => { if (m.status === "recognizing text"){ const el = document.querySelector(".note.ok"); if (el) el.innerHTML = `<span class="spin"></span> Leyendo la factura… ${Math.round(m.progress * 100)}%`; } };
  try { const {data} = await ocrWorker.recognize(cv); return data.text.split("\n"); }
  finally { ocrProgreso = null; }
}
/* Lee un archivo (PDF o foto) y devuelve la factura interpretada */
async function leerArchivo(file){
  const paso = t => { S.msg = {kind: "busy", text: t}; render(); };
  const esPdf = /pdf/i.test(file.type) || /\.pdf$/i.test(file.name || "");
  let f;
  if (esPdf){ paso("Leyendo el PDF…"); f = parseFactura(await pdfLineas(file), false); }
  else { paso("Preparando la foto…"); f = parseFactura(await leerFoto(file, paso), true); f.foto = URL.createObjectURL(file); }
  if (!f.items.length) throw new Error(esPdf ? "No se encontraron productos en este PDF. Cárgala a mano." : "No se reconocieron productos. Toma la foto de frente, con buena luz y la tabla completa y enfocada.");
  f.items = ajustarConCatalogo(f.items);
  f.origen = esPdf ? "pdf" : "foto";
  S.msg = null;
  return f;
}

function syncLineas(items, g){
  $$(`[data-k][data-g="${g}"]`).forEach(inp => {
    const it = items[+inp.dataset.i]; if (!it) return;
    if (inp.dataset.k === "cantidad") it.cantidad = Math.max(0, n2(num(inp.value)));
    else {
      it[inp.dataset.k] = norm(inp.value);
      if (inp.dataset.k === (g === "i" ? "producto" : "codigo")){ const p = productoDe(inp.value); it.nuevo = !p; if (p) it.tipo = tipoDe(S.prod[p]); }
    }
  });
  $$(`[data-tipo][data-g="${g}"]`).forEach(s => { const it = items[+s.dataset.tipo]; if (it) it.tipo = s.value; });
}
function bindLineas(items, g){
  $$(`[data-del][data-g="${g}"]`).forEach(b => b.onclick = () => { syncLineas(items, g); items.splice(+b.dataset.del, 1); render(); });
  const add = $(`[data-add="${g}"]`);
  if (add) add.onclick = () => { syncLineas(items, g); items.push({codigo: "", producto: "", descripcion: "", cantidad: 1, tipo: "serial", nuevo: true}); render(); const ins = $$(`[data-k="codigo"][data-g="${g}"]`); if (ins.length) ins[ins.length - 1].focus(); };
}

async function empezarDespacho(){
  const d = S.draft;
  syncLineas(d.items, "r");
  d.numero = $("#rNum").value.trim(); d.cliente = $("#rCli").value.trim();
  d.items = d.items.filter(i => i.codigo && i.cantidad > 0);
  if (!d.numero){ S.msg = {kind: "bad", text: "Falta el número de factura."}; return render(); }
  if (!d.items.length){ S.msg = {kind: "bad", text: "Agrega al menos un producto con cantidad."}; return render(); }
  const m = {}; d.items.forEach(i => { const k = productoDe(i.codigo) || i.codigo; if (m[k]) m[k].cantidad = n2(m[k].cantidad + i.cantidad); else m[k] = Object.assign({}, i, {codigo: k}); }); d.items = Object.values(m);
  S.msg = {kind: "busy", text: "Verificando la factura…"}; render();
  try {
    const prev = await DB.one("despachos", "numero", d.numero);
    if (prev && prev.estado === "despachada"){ beep("bad"); S.msg = {kind: "bad", text: `La factura ${prev.numero} ya fue despachada por ${(prev.datos && prev.datos.despachador) || "otro usuario"} el ${fmt(prev.fin)}. No se puede despachar dos veces.`}; return render(); }
    if (prev){ S.msg = null; return abrirDespacho(prev); }
    await asegurarProductos(d.items.map(i => ({codigo: i.codigo, descripcion: i.descripcion, tipo: i.tipo})));
    const nuevo = {numero: d.numero, cliente: d.cliente, rif: d.rif, estado: "en_proceso",
      datos: {vendedor: d.vendedor, fecha: d.fecha, despachador: nombreUsuario(), pila: [],
        items: d.items.map(i => ({codigo: i.codigo, descripcion: (S.prod[i.codigo] && S.prod[i.codigo].descripcion) || i.descripcion || "", cantidad: i.cantidad, hechos: 0, seriales: [], cortes: [], tipo: tipoDe(S.prod[i.codigo])}))}};
    await DB.insert("despachos", nuevo);
    S.msg = null; abrirDespacho(nuevo);
  } catch(e){ S.msg = {kind: "bad", text: errMsg(e)}; render(); }
}
function abrirDespacho(row){

  S.cur.datos.items = S.cur.datos.items || []; S.cur.datos.pila = S.cur.datos.pila || [];
  S.cur.datos.items.forEach(i => { i.seriales = i.seriales || []; i.cortes = i.cortes || []; i.tipo = i.tipo || "serial"; i.hechos = i.hechos || 0; });
  S.espera = null; S.draft = null; S.ultimo = null;
  go("despacho");
  const pend = S.cur.datos.items.filter(i => !completa(i)).length;
  setStatus("", pend ? "Escanea el primer producto." : "Todo verificado. Cierra el despacho.", pend ? `${pend} renglones pendientes.` : "");
}

function setStatus(kind, text, sub, acts){
  const el = $("#status");
  el.className = "status " + (kind || "");
  el.innerHTML = esc(text) + (sub ? `<span class="sub">${esc(sub)}</span>` : "") + (acts ? `<div class="acts">${acts}</div>` : "");
  const cm = $("#camMsg"); if (cm){ cm.className = "cam-msg " + (kind || ""); cm.textContent = text + (sub && kind === "bad" ? ". " + sub : ""); }
  el.querySelectorAll("[data-act]").forEach(b => b.onclick = () => ACT[b.dataset.act]());
}
const bad = (t, sub, acts) => { beep("bad"); setStatus("bad", t, sub, acts); };
const btnAct = (act, txt) => `<button class="btn sm" data-act="${act}">${esc(txt)}</button>`;

async function scanDespacho(code){
  const d = S.cur, items = d.datos.items;
  if (S.espera && S.espera.tipo === "serial") return despacharSerial(S.espera.i, code);
  if (S.espera && S.espera.tipo === "rollo") return usarRollo(S.espera.i, code);
  const cod = productoDe(code);
  if (cod){
    const i = items.findIndex(it => canon(it.codigo) === canon(cod));
    if (i < 0) return bad(`${cod} no está en esta factura`, "No entregues este producto.");
    return lineaDespacho(i);
  }
  const u = await buscarUnidad(code); if (u === false) return;
  if (u){
    const i = items.findIndex(it => canon(it.codigo) === canon(u.producto));
    if (i < 0) return bad(`${u.serial} es un ${u.producto}, que no está en esta factura`, "No entregues esta unidad.");
    return items[i].tipo === "metro" ? usarRollo(i, u.serial, u) : despacharSerial(i, u.serial, u);
  }
  S.pendienteAlias = code;
  bad(`${code} no está registrado`, "Si es el código de barras de la caja, asócialo al producto correcto. Si no, no entregues el producto.", btnAct("asociar", "Asociar a un producto") + btnAct("limpiar", "Ignorar"));
}
async function buscarUnidad(serial){
  S.busy = true; setStatus("", `Buscando ${serial}…`);
  try { return await DB.one("unidades", "serial", norm(serial)); }
  catch(e){ bad("No se pudo consultar el inventario", errMsg(e)); return false; }
  finally { S.busy = false; }
}
function lineaDespacho(i){
  const it = S.cur.datos.items[i];
  if (completa(it)) return bad(`Sobra: ya se completó ${it.codigo}`, "Devuelve este producto al depósito.");
  if (it.tipo === "serial"){ S.espera = {tipo: "serial", i}; beep("warn"); return setStatus("warn", `Ahora escanea el serial de ${it.codigo}`, `Unidad ${it.hechos + 1} de ${fnum(it.cantidad)}.`, btnAct("cancelar", "Cancelar")); }
  if (it.tipo === "metro"){ S.espera = {tipo: "rollo", i}; beep("warn"); return setStatus("warn", `Escanea la etiqueta del rollo de ${it.codigo}`, `Faltan ${fnum(it.cantidad - it.hechos)} m.`, btnAct("cancelar", "Cancelar")); }
  agregarDespacho(i, {});
  enqueue(() => DB.insert("movimientos", {tipo: "despacho", producto: it.codigo, cantidad: 1, documento: S.cur.numero}));
}
async function despacharSerial(i, serial, u){
  const d = S.cur, it = d.datos.items[i]; serial = norm(serial);
  if (productoDe(serial) && !u) return bad("Eso es un código de producto, no un serial", `Escanea el serial de la unidad de ${it.codigo}.`, btnAct("cancelar", "Cancelar"));
  if (it.seriales.includes(serial)) return bad(`El serial ${serial} ya se escaneó en esta factura`, "Cada unidad tiene un serial distinto.", btnAct("cancelar", "Cancelar"));
  if (u === undefined){ u = await buscarUnidad(serial); if (u === false) return; }
  if (!u){
    S.pendSerial = {i, serial};
    if (S.prefs.transicion) return bad(`El serial ${serial} nunca ingresó al inventario`, "Si es mercancía que ya tenías antes de usar el sistema, regístrala ahora.", btnAct("regdesp", "Registrar y despachar") + btnAct("cancelar", "Cancelar"));
    return bad(`El serial ${serial} no está en el inventario`, "Esta unidad no ingresó con ninguna compra. Apártala y revisa.", btnAct("cancelar", "Cancelar"));
  }
  if (canon(u.producto) !== canon(it.codigo)) return bad(`Ese serial es de ${u.producto}, no de ${it.codigo}`, "Revisa que sea la caja correcta.", btnAct("cancelar", "Cancelar"));
  if (u.estado !== "deposito") return bad(u.estado === "despachada" ? `El serial ${serial} ya salió con la factura ${u.documento || "?"}` : `El serial ${serial} está en estado "${u.estado}"`, "No entregues esta unidad.", btnAct("cancelar", "Cancelar"));
  S.busy = true; setStatus("", "Registrando salida…");
  try {
    await DB.rpc("cambiar_estado_unidad", {p_serial: serial, p_de: ["deposito"], p_a: "despachada", p_tipo: "despacho", p_documento: d.numero});
    S.busy = false; agregarDespacho(i, {serial});
  } catch(e){ S.busy = false; bad("No se pudo registrar la salida", errMsg(e), btnAct("cancelar", "Cancelar")); }
}
async function usarRollo(i, serial, u){
  const d = S.cur, it = d.datos.items[i]; serial = norm(serial);
  if (u === undefined){ u = await buscarUnidad(serial); if (u === false) return; }
  if (!u) return bad(`${serial} no es un rollo registrado`, "Escanea la etiqueta QR del rollo que vas a cortar.", btnAct("cancelar", "Cancelar"));
  if (canon(u.producto) !== canon(it.codigo)) return bad(`Ese rollo es de ${u.producto}, no de ${it.codigo}`, "", btnAct("cancelar", "Cancelar"));
  if (u.metros_restantes == null) return bad(`${serial} no es un rollo de metros`, "", btnAct("cancelar", "Cancelar"));
  if (!(u.metros_restantes > 0)) return bad(`El rollo ${serial} está agotado`, "Usa otro rollo.", btnAct("cancelar", "Cancelar"));
  const pend = n2(it.cantidad - it.hechos), sug = Math.min(pend, u.metros_restantes);
  beep("warn");
  pedirNumero(`Rollo ${serial}`, `Le quedan ${fnum(u.metros_restantes)} m. Faltan ${fnum(pend)} m de ${it.codigo}. ¿Cuántos metros cortaste de este rollo?`, fnum(sug), async m => {
    if (m > u.metros_restantes + 0.001) return bad(`El rollo solo tiene ${fnum(u.metros_restantes)} m`, "Completa con otro rollo.");
    if (m > pend + 0.001) return bad(`Solo faltan ${fnum(pend)} m en esta factura`, "No cortes de más.");
    S.busy = true; setStatus("", "Registrando corte…");
    try {
      const r = await DB.rpc("mover_metros", {p_serial: serial, p_delta: -m, p_tipo: "corte", p_documento: d.numero});
      S.busy = false; agregarDespacho(i, {serial, metros: m});
      const prod = S.prod[it.codigo];
      if (r && prod && r.metros_restantes < (prod.metros_alerta || 10)) setStatus("warn", `Al rollo ${serial} le quedan ${fnum(r.metros_restantes)} m`, "Está por acabarse.");
    } catch(e){ S.busy = false; bad("No se pudo registrar el corte", errMsg(e)); }
  });
}
function agregarDespacho(i, x){
  const d = S.cur, it = d.datos.items[i];
  it.hechos = n2(it.hechos + (x.metros || 1));
  if (x.metros) it.cortes.push({serial: x.serial, metros: x.metros});
  else if (x.serial) it.seriales.push(x.serial);
  d.datos.pila.push(Object.assign({i}, x));
  S.espera = null; S.ultimo = i;
  guardarDespacho(); beep("ok"); render(); S.ultimo = null;
  const pend = d.datos.items.filter(z => !completa(z)).length;
  if (!pend) setStatus("ok", "Todo verificado. Cierra el despacho.");
  else setStatus("ok", `${it.codigo}: ${qtyTxt(it.hechos, it.cantidad, it.tipo)}`, (x.serial ? `${x.metros ? "Rollo" : "Serial"} ${x.serial}. ` : "") + `Faltan ${pend} renglones.`);
}
async function deshacerDespacho(){
  const d = S.cur, p = d.datos.pila[d.datos.pila.length - 1]; if (!p || S.busy) return;
  const it = d.datos.items[p.i];
  S.busy = true; setStatus("", "Deshaciendo…");
  try {
    if (p.metros) await DB.rpc("mover_metros", {p_serial: p.serial, p_delta: p.metros, p_tipo: "anulacion", p_documento: d.numero, p_nota: "Deshacer corte"});
    else if (p.serial) await DB.rpc("cambiar_estado_unidad", {p_serial: p.serial, p_de: ["despachada"], p_a: "deposito", p_tipo: "anulacion", p_documento: d.numero, p_nota: "Deshacer salida"});
    else await DB.insert("movimientos", {tipo: "anulacion", producto: it.codigo, cantidad: -1, documento: d.numero});
    d.datos.pila.pop();
    it.hechos = n2(Math.max(0, it.hechos - (p.metros || 1)));
    if (p.metros) it.cortes.pop(); else if (p.serial) it.seriales.splice(it.seriales.lastIndexOf(p.serial), 1);
    S.busy = false; guardarDespacho(); render();
    setStatus("", `Se deshizo una unidad de ${it.codigo}`, p.serial ? `${p.metros ? "Los metros volvieron al rollo" : "El serial volvió al depósito"} ${p.serial}.` : "");
  } catch(e){ S.busy = false; bad("No se pudo deshacer", errMsg(e)); }
}
async function cerrarDespacho(){
  const d = S.cur;
  d.estado = "despachada"; d.fin = now();
  await guardarDespacho();
  S.cerrado = clone(d); S.cur = null; S.espera = null;
  beep("ok"); go("listo"); cargarHistorial();
}

async function abrirIngresoRevision(items, f){
  let mapa = {};
  try {
    const rows = await DB.q(sb.from("proveedor_codigos").select("*").eq("proveedor", S.ingForm.proveedor));
    rows.forEach(r => { mapa[canon(r.codigo_proveedor)] = r.producto; });
  } catch(e){}
  S.ingDraft = {origen: f ? f.origen : "manual", foto: f && f.foto,
    items: (items.length ? items : [{codigo: "", descripcion: "", cantidad: 1}]).map(it => {
      const p = mapa[canon(it.codigo)] || productoDe(it.codigo) || "";
      return {codigo: it.codigo, producto: p, descripcion: (p && S.prod[p] && S.prod[p].descripcion) || it.descripcion, cantidad: it.cantidad, nota: p ? "" : it.nota,
        tipo: p ? tipoDe(S.prod[p]) : adivinarTipo(it.descripcion), nuevo: !p};
    })};
  S.msg = null; go("ingresoRevisar");
}

async function empezarIngreso(){
  const d = S.ingDraft;
  syncLineas(d.items, "i");
  d.items.forEach(i => { if (!i.producto) i.producto = i.codigo; i.producto = productoDe(i.producto) || norm(i.producto); });
  d.items = d.items.filter(i => i.producto && i.cantidad > 0);
  if (!d.items.length){ S.msg = {kind: "bad", text: "Agrega al menos un producto con cantidad."}; return render(); }
  S.msg = {kind: "busy", text: "Creando el ingreso…"}; render();
  try {
    const prev = await DB.q(sb.from("ingresos").select("*").eq("proveedor", S.ingForm.proveedor).eq("numero_factura", S.ingForm.numero).maybeSingle());
    if (prev && prev.estado === "cerrado"){ S.msg = {kind: "bad", text: `La factura ${prev.numero_factura} de ${prev.proveedor} ya fue ingresada el ${fmt(prev.cerrado_en)}.`}; return render(); }
    if (prev){ S.msg = null; return abrirIngreso(prev); }
    await asegurarProductos(d.items.map(i => ({producto: i.producto, descripcion: i.descripcion, tipo: i.tipo})));
    const eq = d.items.filter(i => i.codigo && canon(i.codigo) !== canon(i.producto)).map(i => ({proveedor: S.ingForm.proveedor, codigo_proveedor: i.codigo, producto: S.prod[i.producto] ? i.producto : norm(i.producto)}));
    if (eq.length) await DB.upsert("proveedor_codigos", eq, {onConflict: "proveedor,codigo_proveedor"});
    const lineas = {};
    d.items.forEach(i => {
      const k = norm(i.producto);
      if (lineas[k]) lineas[k].cantidad = n2(lineas[k].cantidad + i.cantidad);
      else lineas[k] = {producto: k, codigo_proveedor: i.codigo, descripcion: (S.prod[k] && S.prod[k].descripcion) || i.descripcion, cantidad: i.cantidad, recibidos: 0, seriales: [], rollos: [], tipo: tipoDe(S.prod[k])};
    });
    const r = await DB.q(sb.from("ingresos").insert({proveedor: S.ingForm.proveedor, numero_factura: S.ingForm.numero, items: Object.values(lineas)}).select().single());
    S.msg = null; S.ingDraft = null; abrirIngreso(r);
  } catch(e){ S.msg = {kind: "bad", text: errMsg(e)}; render(); }
}

async function scanIngreso(code){
  const g = S.ing;
  if (S.espera && S.espera.tipo === "serial") return registrarSerialIngreso(S.espera.i, code, "fabricante");
  let cod = productoDe(code);
  if (!cod){ const l = g.items.find(it => canon(it.codigo_proveedor) === canon(code)); if (l) cod = l.producto; }
  if (!cod){
    S.pendienteAlias = code;
    return bad(`${code} no está registrado`, "Si es el código de barras de la caja, asócialo al producto que corresponde.", btnAct("asociar", "Asociar a un producto") + btnAct("limpiar", "Ignorar"));
  }
  const i = g.items.findIndex(it => canon(it.producto) === canon(cod));
  if (i < 0){ S.pendSobrante = cod; return bad(`${cod} no está en esta factura de compra`, "Puede ser un envío de más o un error del proveedor.", btnAct("sobrante", "Recibirlo como sobrante") + btnAct("limpiar", "Ignorar")); }
  lineaIngreso(i);
}
function lineaIngreso(i){
  const it = S.ing.items[i];
  const extra = it.recibidos >= it.cantidad - 0.001 ? " Ojo: ya se completó la cantidad de la factura; será un sobrante." : "";
  if (it.tipo === "serial"){ S.espera = {tipo: "serial", i}; beep("warn"); return setStatus("warn", `Escanea el serial de ${it.producto}`, `Unidad ${it.recibidos + 1} de ${fnum(it.cantidad)}.${extra}`, btnAct("generar", "No tiene serial: generar") + btnAct("cancelar", "Cancelar")); }
  if (it.tipo === "metro") return registrarRollo(i);
  sumarIngreso(i, 1);
}
async function registrarSerialIngreso(i, serial, origen){
  const g = S.ing, it = g.items[i]; serial = norm(serial);
  if (origen === "fabricante" && productoDe(serial)) return bad("Eso es un código de producto, no un serial", `Escanea el serial de la caja de ${it.producto}, o genera uno.`, btnAct("generar", "No tiene serial: generar") + btnAct("cancelar", "Cancelar"));
  S.busy = true; setStatus("", "Registrando…");
  try {
    await DB.rpc("registrar_unidad", {p_serial: serial, p_producto: it.producto, p_origen: origen, p_ingreso: g.id, p_metros: null, p_documento: docIngreso()});
    if (origen === "interno" || g.etiquetarTodo) await nuevaEtiqueta({serial, producto: it.producto, descripcion: it.descripcion, tipo: "unidad"});
    S.busy = false;
    it.recibidos = n2(it.recibidos + 1); it.seriales.push(serial);
    g.pila.push({i, serial}); S.espera = null; S.ultimo = i;
    guardarIngreso(); beep("ok"); render(); S.ultimo = null;
    setStatus("ok", `${it.producto}: ${qtyTxt(it.recibidos, it.cantidad, it.tipo)}`, `Serial ${serial} registrado${origen === "interno" || g.etiquetarTodo ? " y enviado a imprimir" : ""}.`, btnAct("deshacer", "Deshacer"));
  } catch(e){ S.busy = false; bad("No se pudo registrar", errMsg(e), btnAct("cancelar", "Cancelar")); }
}
async function generarSerialIngreso(i){
  S.busy = true; setStatus("", "Generando serial…");
  try { const s = await DB.rpc("generar_serial", {}); S.busy = false; await registrarSerialIngreso(i, s, "interno"); }
  catch(e){ S.busy = false; bad("No se pudo generar el serial", errMsg(e)); }
}
function registrarRollo(i){
  const it = S.ing.items[i], falta = n2(it.cantidad - it.recibidos);
  pedirNumero(`Nuevo rollo de ${it.producto}`, "¿Cuántos metros tiene este rollo? Se le crea una etiqueta con QR.", fnum(falta > 0 ? falta : 100), async m => {
    S.busy = true; setStatus("", "Registrando rollo…");
    try {
      const s = await DB.rpc("generar_serial", {});
      await DB.rpc("registrar_unidad", {p_serial: s, p_producto: it.producto, p_origen: "interno", p_ingreso: S.ing.id, p_metros: m, p_documento: docIngreso()});
      await nuevaEtiqueta({serial: s, producto: it.producto, descripcion: it.descripcion, tipo: "rollo", metros: m});
      S.busy = false;
      it.recibidos = n2(it.recibidos + m); it.rollos = it.rollos || []; it.rollos.push({serial: s, metros: m});
      S.ing.pila.push({i, serial: s, metros: m}); S.ultimo = i;
      guardarIngreso(); beep("ok"); render(); S.ultimo = null;
      setStatus("ok", `Rollo ${s} de ${fnum(m)} m registrado`, "Su etiqueta ya está en la cola de impresión.", btnAct("deshacer", "Deshacer"));
    } catch(e){ S.busy = false; bad("No se pudo registrar el rollo", errMsg(e)); }
  });
}
function sumarIngreso(i, n){
  const g = S.ing, it = g.items[i];
  it.recibidos = n2(it.recibidos + n); g.pila.push({i, cantidad: n}); S.ultimo = i;
  enqueue(() => DB.insert("movimientos", {tipo: "ingreso", producto: it.producto, cantidad: n, documento: docIngreso()}));
  guardarIngreso(); beep("ok"); render(); S.ultimo = null;
  setStatus("ok", `${it.producto}: ${qtyTxt(it.recibidos, it.cantidad, it.tipo)}`, "", btnAct("deshacer", "Deshacer"));
}
async function deshacerIngreso(){
  const g = S.ing, p = g.pila[g.pila.length - 1]; if (!p || S.busy) return;
  const it = g.items[p.i];
  S.busy = true;
  try {
    if (p.serial){
      await DB.rpc("cambiar_estado_unidad", {p_serial: p.serial, p_de: ["deposito"], p_a: "baja", p_tipo: "anulacion", p_documento: docIngreso(), p_nota: "Registrado por error en el ingreso"});
      await DB.q(sb.from("etiquetas").update({impresa: true}).eq("serial", p.serial).eq("impresa", false));
      contarEtiquetas();
    } else await DB.insert("movimientos", {tipo: "anulacion", producto: it.producto, cantidad: -p.cantidad, documento: docIngreso()});
    g.pila.pop();
    it.recibidos = n2(Math.max(0, it.recibidos - (p.metros || p.cantidad || 1)));
    if (p.metros) it.rollos.pop(); else if (p.serial) it.seriales.splice(it.seriales.lastIndexOf(p.serial), 1);
    S.busy = false; guardarIngreso(); render();
    setStatus("", `Se deshizo el último registro de ${it.producto}`, p.serial ? `${p.serial} quedó anulado.` : "");
  } catch(e){ S.busy = false; bad("No se pudo deshacer", errMsg(e)); }
}
function cerrarIngreso(){
  const g = S.ing;
  const falt = g.items.filter(i => i.recibidos < i.cantidad - 0.001), sobr = g.items.filter(i => i.recibidos > i.cantidad + 0.001);
  sheet(`<h2 style="margin-top:0">Cerrar ingreso ${esc(g.numero_factura)}</h2>
    ${!falt.length && !sobr.length ? `<div class="note ok">Todo cuadra con la factura de compra.</div>` : ""}
    ${falt.length ? `<div class="note bad"><b>Faltantes:</b><br>${falt.map(i => `${esc(i.producto)}: llegaron ${fnum(i.recibidos)} de ${fnum(i.cantidad)}${i.tipo === "metro" ? " m" : ""}`).join("<br>")}</div>` : ""}
    ${sobr.length ? `<div class="note" style="margin-top:8px"><b>Sobrantes:</b><br>${sobr.map(i => `${esc(i.producto)}: llegaron ${fnum(i.recibidos)}, la factura dice ${fnum(i.cantidad)}`).join("<br>")}</div>` : ""}
    <label class="f" for="giNota" style="margin-top:12px">Nota (opcional)</label><input class="in" id="giNota" placeholder="Ej. caja golpeada, se reclamó al proveedor">
    <div class="row" style="margin-top:12px"><button class="btn ok" id="giOk">Cerrar ingreso</button><button class="btn" id="giNo">Volver</button></div>`, () => {
    $("#giNo").onclick = cerrarSheet;
    $("#giOk").onclick = async () => {
      const nota = $("#giNota").value.trim();
      cerrarSheet();
      try {
        await cola;
        await DB.update("ingresos", "id", g.id, {items: clone(g.items), estado: "cerrado", cerrado_en: now(), nota: nota || null});
        S.ingCerrado = {g: clone(g), falt: falt.length, sobr: sobr.length}; S.ing = null; S.espera = null; S.ingForm = null;
        beep("ok"); go("ingresoListo"); cargarIngresos();
      } catch(e){ bad("No se pudo cerrar", errMsg(e)); }
    };
  });
}

async function subirFoto(file, tipo, id){
  const cv = await prepararImagen(file, 1400, false);
  const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.72));
  const ruta = `${tipo}/${id}/${Date.now()}.jpg`;
  const up = await sb.storage.from("fotos").upload(ruta, blob, {contentType: "image/jpeg"});
  if (up.error) throw up.error;
  await DB.insert("fotos", {ruta, referencia_tipo: tipo, referencia_id: String(id)});
}

function verDevolucion(id){
  const dv = (S.devLista || []).concat((S.detalleData && S.detalleData.devs) || []).find(x => x.id === id); if (!dv) return;

async function iniciarDevolucion(numero){
  S.msg = {kind: "busy", text: "Buscando la factura…"}; render();
  try {
    const [d, prevs] = await Promise.all([DB.one("despachos", "numero", numero), DB.q(sb.from("devoluciones").select("datos").eq("numero_factura", numero))]);
    if (!d){ S.msg = {kind: "bad", text: `La factura ${numero} no salió con el sistema. Puedes registrarla sin factura del sistema.`}; return render(); }
    const prev = {};
    (prevs || []).forEach(p => ((p.datos && p.datos.items) || []).forEach(it => {
      const k = canon(it.codigo); prev[k] = prev[k] || {cant: 0, seriales: []};
      prev[k].cant = n2(prev[k].cant + it.cantidad); (it.seriales || []).forEach(s => s && prev[k].seriales.push(s));
    }));
    const items = ((d.datos && d.datos.items) || []).filter(it => it.hechos > 0).map(it => {
      const r = prev[canon(it.codigo)] || {cant: 0, seriales: []};
      return {codigo: it.codigo, descripcion: it.descripcion, tipo: it.tipo, despachado: it.hechos, previo: r.cant,
        disponibles: (it.seriales || []).filter(s => s && !r.seriales.includes(s)), ahora: 0, serialesAhora: [], metros: []};
    });
    if (!items.some(it => it.despachado - it.previo > 0.001)){ S.msg = {kind: "bad", text: `Todo lo de la factura ${numero} ya fue devuelto.`}; return render(); }
    S.dev = {id: "DV-" + Date.now(), vinculada: true, numeroFactura: numero, cliente: d.cliente, motivo: "", nota: "", items, pila: []};
    S.msg = null; S.espera = null; go("devolucion");
    setStatus("", "Escanea el producto o el serial que devuelve el cliente.", "Solo se aceptan unidades que salieron con esta factura.");
  } catch(e){ S.msg = {kind: "bad", text: errMsg(e)}; render(); }
}

async function scanDevolucion(code){
  const dv = S.dev; code = norm(code);
  if (!dv.vinculada){
    let cod = productoDe(code), serial = null;
    if (!cod){ const u = await buscarUnidad(code); if (u === false) return; if (u){ cod = u.producto; serial = u.serial; } }
    cod = cod || code;
    let i = dv.items.findIndex(it => canon(it.codigo) === canon(cod));
    if (i < 0){ const p = S.prod[cod]; dv.items.push({codigo: cod, descripcion: p ? p.descripcion : "", tipo: p ? tipoDe(p) : "sinserial", ahora: 0, serialesAhora: [], metros: []}); i = dv.items.length - 1; }
    if (dv.items[i].tipo === "metro") return pedirMetrosDev(i, null);
    if (serial && dv.items[i].serialesAhora.includes(serial)) return bad(`El serial ${serial} ya está en esta devolución`);
    return agregarDev(i, serial);
  }
  if (S.espera && S.espera.tipo === "serial"){
    const it = dv.items[S.espera.i];
    if (it.serialesAhora.includes(code)) return bad(`El serial ${code} ya está en esta devolución`, "", btnAct("cancelar", "Cancelar"));
    if (!it.disponibles.includes(code)) return bad(`El serial ${code} no salió con la factura ${dv.numeroFactura}`, "No recibas esta unidad sin revisar de qué factura viene.", btnAct("cancelar", "Cancelar"));
    return agregarDev(S.espera.i, code);
  }
  const porSerial = dv.items.findIndex(it => it.disponibles.includes(code) && !it.serialesAhora.includes(code));
  if (porSerial >= 0) return agregarDev(porSerial, code);
  if (dv.items.some(it => it.serialesAhora.includes(code))) return bad(`El serial ${code} ya está en esta devolución`);
  const cod = productoDe(code);
  const i = cod ? dv.items.findIndex(it => canon(it.codigo) === canon(cod)) : -1;
  if (i < 0) return bad(`${code} no salió con la factura ${dv.numeroFactura}`, "No recibas este producto en esta devolución.");
  const it = dv.items[i], max = n2(it.despachado - it.previo);
  if (it.tipo === "metro") return pedirMetrosDev(i, max);
  if (it.ahora >= max) return bad(`No se pueden devolver más unidades de ${it.codigo}`, `Salieron ${fnum(it.despachado)}${it.previo ? ` y ya se habían devuelto ${fnum(it.previo)}` : ""}.`);
  if (it.tipo === "serial" && it.disponibles.length){ S.espera = {tipo: "serial", i}; beep("warn"); return setStatus("warn", `Ahora escanea el serial de ${it.codigo}`, "Debe ser uno de los que salieron con esta factura.", btnAct("cancelar", "Cancelar")); }
  agregarDev(i, null);
}
function pedirMetrosDev(i, max){
  const it = S.dev.items[i];
  const disp = max === null ? null : n2(max - it.ahora);
  if (disp !== null && disp <= 0) return bad(`Ya se devolvieron todos los metros de ${it.codigo}`);
  pedirNumero(`Devolución de ${it.codigo}`, `¿Cuántos metros devuelve el cliente?${disp !== null ? ` Máximo ${fnum(disp)} m.` : ""} Si el cable vuelve a un rollo, escanea o escribe la etiqueta del rollo; si es un retazo, deja el campo vacío.`, disp !== null ? fnum(disp) : "",
    (m, sh) => {
      const rollo = norm($("#shRollo") ? $("#shRollo").value : "");
      if (disp !== null && m > disp + 0.001) return bad(`Solo se pueden devolver ${fnum(disp)} m`);
      it.ahora = n2(it.ahora + m); it.metros.push({metros: m, rollo: rollo || null});
      S.dev.pila.push({i, metros: m}); S.ultimo = i; beep("ok"); render(); S.ultimo = null;
      setStatus("ok", `${it.codigo}: ${fnum(it.ahora)} m a devolver`, rollo ? `Volverán al rollo ${rollo}.` : "Se registran como retazo.");
    }, `<input class="in" id="shRollo" placeholder="Etiqueta del rollo (opcional)" style="margin-top:8px" autocomplete="off">`);
}
function agregarDev(i, serial){
  const dv = S.dev, it = dv.items[i];
  it.ahora = n2(it.ahora + 1); it.serialesAhora.push(serial || "");
  dv.pila.push({i, serial}); S.espera = null; S.ultimo = i;
  beep("ok"); render(); S.ultimo = null;
  setStatus("ok", `${it.codigo}: ${fnum(it.ahora)} a devolver`, serial ? `Serial ${serial}.` : "");
}
function deshacerDev(){
  const dv = S.dev, p = dv.pila.pop(); if (!p) return;
  const it = dv.items[p.i];
  if (p.metros){ it.ahora = n2(it.ahora - p.metros); it.metros.pop(); }
  else { it.ahora = n2(it.ahora - 1); it.serialesAhora.pop(); }
  S.espera = null; render(); setStatus("", `Se quitó el último registro de ${it.codigo}`);
}
async function registrarDevolucion(){
  const dv = S.dev;
  if (!dv.motivo){ bad("Elige el motivo de la devolución", "Está arriba, antes de la lista de productos."); const m = $("#dvMot"); if (m) m.focus(); return; }
  const estadoFinal = dv.motivo === MOTIVOS[0] ? "garantia" : "deposito";
  const doc = dv.numeroFactura || dv.id, errores = [];
  S.busy = true; setStatus("", "Registrando devolución…");
  for (const it of dv.items.filter(x => x.ahora > 0)){
    for (const s of it.serialesAhora.filter(Boolean)){
      try { await DB.rpc("cambiar_estado_unidad", {p_serial: s, p_de: ["despachada"], p_a: estadoFinal, p_tipo: "devolucion", p_documento: doc, p_nota: dv.motivo}); }
      catch(e){ errores.push(`${s}: ${errMsg(e)}`); }
    }
    for (const m of (it.metros || [])){
      try {
        if (m.rollo && estadoFinal === "deposito") await DB.rpc("mover_metros", {p_serial: m.rollo, p_delta: m.metros, p_tipo: "devolucion", p_documento: doc, p_nota: dv.motivo});
        else await DB.insert("movimientos", {tipo: "devolucion", producto: it.codigo, cantidad: 0, metros: m.metros, documento: doc, nota: dv.motivo + " (retazo)"});
      } catch(e){ errores.push(`${it.codigo} ${fnum(m.metros)} m: ${errMsg(e)}`); }
    }
    const sinSerial = it.tipo !== "metro" ? it.serialesAhora.filter(x => !x).length : 0;
    if (sinSerial) { try { await DB.insert("movimientos", {tipo: "devolucion", producto: it.codigo, cantidad: sinSerial, documento: doc, nota: dv.motivo}); } catch(e){ errores.push(errMsg(e)); } }
  }
  const items = dv.items.filter(x => x.ahora > 0).map(it => ({codigo: it.codigo, descripcion: it.descripcion, tipo: it.tipo, cantidad: it.ahora, seriales: it.serialesAhora.filter(Boolean), metros: it.metros}));
  try {
    await DB.insert("devoluciones", {id: dv.id, numero_factura: dv.numeroFactura || null, cliente: dv.cliente || null, motivo: dv.motivo, nota: dv.nota || null, vinculada: dv.vinculada, datos: {items, errores, usuario: nombreUsuario()}});
    S.busy = false;
    S.devCerrada = {numero: dv.numeroFactura, motivo: dv.motivo, n: items.length, errores}; S.dev = null; S.espera = null;
    beep(errores.length ? "warn" : "ok"); go("devListo");
  } catch(e){ S.busy = false; bad("No se pudo registrar la devolución", errMsg(e)); }
}

async function buscarInventario(q){
  q = norm(q); S.invQ = q; if (!q) return;
  S.inv = {cargando: true}; render();
  try {
    const cod = productoDe(q);
    if (cod) return verProducto(cod);
    const u = await DB.one("unidades", "serial", q);
    if (u){
      const movs = await DB.q(sb.from("movimientos").select("*").eq("serial", q).order("fecha", {ascending: false}).limit(100));
      const ids = Array.from(new Set(movs.map(m => m.usuario).filter(Boolean)));
      const nombres = {};
      if (ids.length){ const ps = await DB.q(sb.from("perfiles").select("id,nombre,email").in("id", ids)); ps.forEach(p => { nombres[p.id] = p.nombre || p.email; }); }
      S.inv = {unidad: u, movs, nombres};
    } else {
      const lista = Object.values(S.prod).filter(p => norm(p.codigo).includes(q) || norm(p.descripcion).includes(q)).slice(0, 40);
      S.inv = {lista};
    }
  } catch(e){ S.inv = null; S.msg = {kind: "bad", text: errMsg(e)}; }
  if (S.view === "inventario") render();
}
async function verProducto(cod){
  S.inv = {cargando: true}; render();

    const [unidades, codigos] = await Promise.all([
      DB.all("unidades", q => q.eq("producto", cod).in("estado", ["deposito"]).order("creado")),
      DB.q(sb.from("codigos_barra").select("*").eq("producto", cod))]);
    S.inv = {producto: S.prod[cod], unidades, codigos};
  } catch(e){ S.inv = null; S.msg = {kind: "bad", text: errMsg(e)}; }
  if (S.view === "inventario") render();
}

  try {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb = XLSX.read(await file.arrayBuffer(), {type: "array"});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: false, defval: ""});
    let hdr = -1, ci = 0, di = 1;
    for (let r = 0; r < Math.min(rows.length, 15); r++){
      const row = rows[r].map(c => String(c).toLowerCase());
      const c = row.findIndex(x => /c[oó]d/.test(x)), d = row.findIndex(x => /desc/.test(x));
      if (c >= 0 && d >= 0){ hdr = r; ci = c; di = d; break; }
    }
    const nuevos = [], actualizar = [];
    rows.slice(hdr + 1).forEach(row => {
      const cod = norm(row[ci]); if (!cod || cod.length < 2 || /^c[oó]d/i.test(cod)) return;
      const desc = String(row[di] || "").trim();
      if (S.prod[cod]) { if (desc && desc !== S.prod[cod].descripcion) actualizar.push({codigo: cod, descripcion: desc}); }
      else if (!nuevos.some(n => n.codigo === cod)) nuevos.push(Object.assign({codigo: cod, descripcion: desc}, tipoAProducto(adivinarTipo(desc))));
    });
    if (!nuevos.length && !actualizar.length) throw new Error("No se encontraron productos nuevos. El archivo debe tener una columna de código y otra de descripción.");
    for (let k = 0; k < nuevos.length; k += 500){ S.msg = {kind: "busy", text: `Guardando productos ${k + 1} a ${Math.min(k + 500, nuevos.length)} de ${nuevos.length}…`}; render(); await DB.upsert("productos", nuevos.slice(k, k + 500), {onConflict: "codigo", ignoreDuplicates: true}); }
    for (const a of actualizar) await DB.update("productos", "codigo", a.codigo, {descripcion: a.descripcion, actualizado: now()});
    await cargarCatalogo();
    S.msg = {kind: "ok", text: `Catálogo importado: ${nuevos.length} productos nuevos y ${actualizar.length} descripciones actualizadas. Los cables se marcaron "por metro" según su descripción; revisa el tipo de cada producto buscándolo aquí.`};
  } catch(e){ S.msg = {kind: "bad", text: errMsg(e)}; }
  render();
}

async function qrDataUrl(texto){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js");
  const el = $("#qrtmp"); el.innerHTML = "";
  new QRCode(el, {text: texto, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M});
  const cv = el.querySelector("canvas");
  return cv ? cv.toDataURL("image/png") : (el.querySelector("img") || {}).src;
}
async function imprimir(lista){
  const [w, h] = S.prefs.etiqueta.split("x").map(Number);
  const qr = Math.min(h - 2, w * 0.45);
  const partes = [];
  for (const e of lista){
    const texto = e.tipo === "producto" ? e.producto : e.serial;
    const img = await qrDataUrl(texto);
    const desc = (e.descripcion || (S.prod[e.producto] && S.prod[e.producto].descripcion) || "").slice(0, 60);
    partes.push(`<div class="etq" style="width:${w}mm;height:${h}mm"><img src="${img}" style="width:${qr}mm;height:${qr}mm" alt="">
      <div class="tx"><div class="s" style="font-size:${h * 0.14}mm">${esc(texto)}</div>
      ${e.tipo !== "producto" ? `<div class="c" style="font-size:${h * 0.1}mm">${esc(e.producto)}</div>` : ""}
      ${e.tipo === "rollo" ? `<div class="c" style="font-size:${h * 0.12}mm">${fnum(e.metros)} m</div>` : ""}
      <div class="d" style="font-size:${h * 0.085}mm">${esc(desc)}</div>
      <div class="b" style="font-size:${h * 0.07}mm">SONIDOS TITO</div></div></div>`);
  }
  $("#print").innerHTML = `<style>@page{size:${w}mm ${h}mm;margin:0}</style>` + partes.join("");
  setTimeout(() => window.print(), 300);
}

    $("#etPrint").onclick = () => imprimir(S.etq.filter(e => S.etqSel[e.id]));
    armar($("#etDone"), "Toca de nuevo para confirmar", async () => {
      const ids = S.etq.filter(e => S.etqSel[e.id]).map(e => e.id);
      try { await DB.q(sb.from("etiquetas").update({impresa: true}).in("id", ids)); ids.forEach(id => delete S.etqSel[id]); await cargarEtiquetas(); contarEtiquetas(); }
      catch(e){ S.msg = {kind: "bad", text: errMsg(e)}; render(); }
    });
    $("#etTest").onclick = () => imprimir([{tipo: "unidad", serial: "ST-000000", producto: "EVO6-400.4", descripcion: "AMPLIFICADOR 4 CANALES 400RMS (PRUEBA)"}]);
  },
  ajustes(){
    $("#aSon").onchange = e => { S.prefs.sonido = e.target.checked; savePrefs(); };
    $("#aTrans").onchange = e => { S.prefs.transicion = e.target.checked; savePrefs(); };
    $("#aEtq").onchange = e => { S.prefs.etiqueta = e.target.value; savePrefs(); };
    const bi = $("#bInstalar"); if (bi) bi.onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; render(); };
    $("#aRecargar").onclick = async () => { S.msg = {kind: "busy", text: "Recargando…"}; render(); try { await cargarCatalogo(); S.msg = {kind: "ok", text: `Catálogo actualizado: ${Object.keys(S.prod).length} productos.`}; } catch(e){ S.msg = {kind: "bad", text: errMsg(e)}; } render(); };
    $("#aSalir").onclick = async () => { await sb.auth.signOut(); S.perfil = null; S.user = null; S.cur = null; S.ing = null; S.dev = null; S.msg = null; go("login"); };
    cargarUsuarios();
  }
};
function bindHist(){
  $$("[data-open]").forEach(b => b.onclick = () => {
    const d = S.hist.find(x => x.numero === b.dataset.open);
    if (d && d.estado === "en_proceso" && S.view === "salida") return abrirDespacho(d);
    abrirDetalle(b.dataset.open);
  });
  $$("[data-dev]").forEach(b => b.onclick = () => verDevolucion(b.dataset.dev));
}
function agregarLineaIngreso(p, cantidad){
  const g = S.ing;
  let i = g.items.findIndex(it => canon(it.producto) === canon(p));
  if (i < 0){ g.items.push({producto: p, codigo_proveedor: "", descripcion: S.prod[p] ? S.prod[p].descripcion : "", cantidad, recibidos: 0, seriales: [], rollos: [], tipo: tipoDe(S.prod[p])}); i = g.items.length - 1; guardarIngreso(); }
  render(); lineaIngreso(i);
}

/* ================= acciones de la barra ================= */
const ACT = {
  cancelar(){ S.espera = null; setStatus("", "Escanea el siguiente producto."); },
  limpiar(){ S.pendienteAlias = null; S.pendSobrante = null; setStatus("", "Escanea el siguiente producto."); },
  generar(){ if (S.espera && S.mode === "ingreso") generarSerialIngreso(S.espera.i); },
  deshacer(){ if (S.mode === "ingreso") deshacerIngreso(); },
  sobrante(){ const p = S.pendSobrante; S.pendSobrante = null; if (p) agregarLineaIngreso(p, 0); },
  async regdesp(){
    const x = S.pendSerial; if (!x || !S.cur) return;
    const it = S.cur.datos.items[x.i];
    S.busy = true; setStatus("", "Registrando en el inventario…");
    try {
      await DB.rpc("registrar_unidad", {p_serial: x.serial, p_producto: it.codigo, p_origen: "fabricante", p_ingreso: null, p_metros: null, p_documento: "Inventario inicial"});
      S.busy = false; S.pendSerial = null;
      await despacharSerial(x.i, x.serial, {serial: x.serial, producto: it.codigo, estado: "deposito"});
    } catch(e){ S.busy = false; bad("No se pudo registrar", errMsg(e)); }
  },
  asociar(){
    const code = S.pendienteAlias; if (!code) return;
    closeCam();
    const items = S.mode === "ingreso" ? S.ing.items.map(x => ({codigo: x.producto, descripcion: x.descripcion})) : S.mode === "despacho" ? S.cur.datos.items : [];
    sheet(`<h2 style="margin-top:0">¿Qué producto es ${esc(code)}?</h2>
      <p class="muted small">Desde ahora, este código de barras se reconocerá como el producto que elijas, en todos los teléfonos.</p>
      ${items.map((x, i) => `<button class="pick" data-pick="${i}"><span class="code" style="font-size:18px">${esc(x.codigo)}</span><div class="small muted">${esc(x.descripcion)}</div></button>`).join("")}
      <button class="btn" style="margin-top:12px" data-pick="-1">Cancelar</button>`, sh => {
      sh.querySelectorAll("[data-pick]").forEach(b => b.onclick = async () => {
        cerrarSheet();
        const i = +b.dataset.pick; if (i < 0) return ACT.limpiar();
        try { await asociarCodigo(code, items[i].codigo); S.pendienteAlias = null; onScan(code); }
        catch(e){ bad("No se pudo asociar", errMsg(e)); }
      });
    });
  }
};

/* ================= entradas: cámara, teclado, lector, foto ================= */
function onScan(raw){
  const code = norm(raw);
  if (!code || S.busy || !$("#modal").hidden) return;
  if (S.mode === "despacho" && S.cur) return scanDespacho(code);
  if (S.mode === "ingreso" && S.ing) return scanIngreso(code);
  if (S.mode === "devolucion" && S.dev) return scanDevolucion(code);
  if (S.mode === "buscar"){ closeCam(); return buscarInventario(code); }
}
const scanIn = $("#scanIn");
const enviarManual = () => { const v = scanIn.value; scanIn.value = ""; onScan(v); };
scanIn.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); enviarManual(); } });
$("#scanGo").onclick = enviarManual;

let qr = null, camOn = false, lastHit = {code: "", t: 0};
async function openCam(){
  try { await loadScript("https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"); }
  catch(e){ return setStatus("bad", "El lector de cámara no cargó", "Revisa la conexión a internet."); }
  if (!window.isSecureContext) return setStatus("bad", "La cámara necesita una dirección https");
  $("#cam").hidden = false;
  $("#camMsg").className = "cam-msg"; $("#camMsg").textContent = "Apunta al código de barras o QR";
  try {
    qr = qr || new Html5Qrcode("reader", {verbose: false, experimentalFeatures: {useBarCodeDetectorIfSupported: true}});
    await qr.start({facingMode: "environment"},
      {fps: 12, qrbox: (w, h) => ({width: Math.floor(w * 0.85), height: Math.floor(Math.min(h, w) * 0.45)})},
      text => {
        const t = Date.now(), c = norm(text);
        if (S.busy || !$("#modal").hidden) return;
        if (t - lastHit.t < 1300 || (c === lastHit.code && t - lastHit.t < 3000)) return;
        lastHit = {code: c, t};
        if (S.mode === "despacho" || S.mode === "ingreso" || S.mode === "devolucion"){
          // si la acción abrirá un cuadro para escribir metros, se cierra la cámara
          const esRollo = (S.espera && S.espera.tipo === "rollo") || (S.mode === "ingreso" && (() => { const p = productoDe(c); return p && tipoDe(S.prod[p]) === "metro"; })());
          if (esRollo) closeCam();
        }
        onScan(c);
      }, () => {});
    camOn = true;
  } catch(e){
    $("#cam").hidden = true;
    const denied = e && /NotAllowed|Permission/i.test(String(e.name || e));
    setStatus("bad", denied ? "No se dio permiso para usar la cámara" : "No se pudo abrir la cámara", denied ? "Permite la cámara en los ajustes del navegador." : "Usa el botón de foto o escribe el código.");
  }
}
async function closeCam(){
  $("#cam").hidden = true;
  if (qr && camOn){ try { await qr.stop(); } catch(e){} camOn = false; }
}
$("#camBtn").onclick = openCam;
$("#camClose").onclick = closeCam;
$("#photoCode").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { await loadScript("https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"); } catch(err){ return setStatus("bad", "El lector de códigos no cargó"); }
  setStatus("", "Leyendo el código de la foto…");
  try {
    const r = new Html5Qrcode("reader-file", {verbose: false});
    const text = await r.scanFile(f, false);
    try { r.clear(); } catch(_){}
    onScan(text);
  } catch(err){ bad("No se encontró un código en la foto", "Acércate más, con buena luz y el código completo."); }
});
// al abrirse un cuadro de metros durante la cámara, se cierra para poder escribir
new MutationObserver(() => { if (!$("#modal").hidden) closeCam(); }).observe($("#modal"), {attributes: true, attributeFilter: ["hidden"]});

/* ================= WhatsApp y app instalada ================= */
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (S.view === "ajustes") render(); });
window.addEventListener("appinstalled", () => { installEvt = null; });
if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js").catch(e => console.warn("sw", e));
async function recibirCompartido(){
  const params = new URLSearchParams(location.search);
  if (!params.has("compartido")) return;
  history.replaceState(null, "", location.pathname);
  try {
    const cache = await caches.open("compartido");
    const key = new URL("factura-compartida", location.href).href;
    const res = await cache.match(key);
    if (!res) return;
    const blob = await res.blob();
    const nombre = decodeURIComponent(res.headers.get("X-Nombre") || "factura");
    await cache.delete(key);
    const file = new File([blob], nombre, {type: blob.type});
    sheet(`<h2 style="margin-top:0">Llegó un archivo</h2><p class="muted small">${esc(nombre)}</p>
      <button class="btn primary" id="shVenta">Es una factura de venta (salida)</button>
      <button class="btn" id="shCompra" style="margin-top:10px">Es una factura de compra (ingreso)</button>
      <button class="btn" id="shNo" style="margin-top:10px">Cancelar</button>`, () => {
      $("#shNo").onclick = cerrarSheet;
      $("#shVenta").onclick = async () => { cerrarSheet(); go("salida"); try { abrirRevision(await leerArchivo(file)); } catch(e){ S.msg = {kind: "bad", text: e.message}; render(); } };
      $("#shCompra").onclick = () => { cerrarSheet(); S.pendFile = {file, para: "ingreso"}; go("ingreso"); cargarIngresos(); };
    });
  } catch(e){ console.warn(e); }
}
window.addEventListener("beforeunload", e => { if (S.dev && S.dev.pila.length){ e.preventDefault(); e.returnValue = ""; } });

/* ================= arranque ================= */
async function iniciar(){
  render();
  try { await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"); }
  catch(e){ S.msg = {kind: "bad", text: "No se pudo conectar. Revisa internet y recarga la página."}; return render(); }
  sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {auth: {persistSession: true, autoRefreshToken: true}});
  window.__sb = sb;
  const {data} = await sb.auth.getSession();
  if (data && data.session) arrancar(data.session.user);
  else render();
}
iniciar();
})();
</script>
